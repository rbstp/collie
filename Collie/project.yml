name: Collie

options:
  bundleIdPrefix: dev.rbstp
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"

packages:
  CollieCore:
    path: CollieCore
  GhosttyTerminal:
    path: GhosttyTerminal

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: RM3UT3MMSR
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Overridden from the command line by the TestFlight workflow.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Collie:
    type: application
    platform: iOS
    sources:
      - path: Sources/Collie
      - path: Sources/Shared
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Assets.xcassets
    dependencies:
      - package: CollieCore
      - package: GhosttyTerminal
      - target: ColliePush
      - target: CollieWidgets
      - target: CollieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rbstp.collie
        PRODUCT_NAME: Collie
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Collie.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          # Expanded into the entitlements and Info.plist, so the token's environment always matches the signing.
          APS_ENVIRONMENT: development
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Collie App Store"
          APS_ENVIRONMENT: production

  # Pure Swift: must never link CollieCore (the Go runtime starts at image load).
  ColliePush:
    type: app-extension
    platform: iOS
    sources:
      - path: ColliePush
      - path: Sources/Shared
        excludes:
          - AgentActivity.swift
          - DecideApprovalIntent.swift
          - WatchState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rbstp.collie.push
        PRODUCT_NAME: ColliePush
        INFOPLIST_FILE: ColliePush/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ColliePush/ColliePush.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Collie Push App Store"

  # Live Activity UI. Pure Swift: must never link CollieCore, like ColliePush.
  CollieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CollieWidgets
      - path: Sources/Shared/AgentActivity.swift
      - path: Sources/Shared/DecideApprovalIntent.swift
      - path: Sources/Shared/NotificationKey.swift
      - path: Sources/Shared/PushHint.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rbstp.collie.widgets
        PRODUCT_NAME: CollieWidgets
        INFOPLIST_FILE: CollieWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CollieWidgets/CollieWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Collie Widgets App Store"

  # Pure Swift: must never link CollieCore; holds no keys and reaches collied only through the phone.
  CollieWatch:
    type: application
    platform: watchOS
    sources:
      - path: CollieWatch
      - path: Sources/Shared/WatchState.swift
      - path: Sources/Shared/PushHint.swift
      - path: Resources/Assets.xcassets
    dependencies:
      - target: CollieWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rbstp.collie.watchkitapp
        PRODUCT_NAME: CollieWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: collie
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.rbstp.collie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CollieWatch/CollieWatch.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Collie Watch App Store"

  # Usage ring complication. Pure Swift, like CollieWatch.
  CollieWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: CollieWatchWidgets
      - path: Sources/Shared/WatchState.swift
      - path: Sources/Shared/PushHint.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rbstp.collie.watchkitapp.widgets
        PRODUCT_NAME: CollieWatchWidgets
        INFOPLIST_FILE: CollieWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CollieWatchWidgets/CollieWatchWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Collie Watch Widgets App Store"

  CollieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CollieTests
    dependencies:
      - target: Collie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Collie:
    build:
      targets:
        Collie: all
        CollieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CollieTests
    archive:
      config: Release
