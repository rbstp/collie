name: CollieBar

options:
  bundleIdPrefix: dev.rbstp
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: RM3UT3MMSR
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad hoc here; `just mac-install` signs with the Developer ID.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

targets:
  # Pure Swift, no packages: reaches collied only through its control socket.
  CollieBar:
    type: application
    platform: macOS
    sources:
      - path: CollieBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rbstp.colliebar
        PRODUCT_NAME: CollieBar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Collie
        ENABLE_HARDENED_RUNTIME: YES
        # The sandbox would block the control socket and running collied.
        ENABLE_APP_SANDBOX: NO

  # No host app: a hosted test would launch the app, whose watch connects to the live collied.
  CollieBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CollieBarTests
      - path: CollieBar/ControlClient.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  CollieBar:
    build:
      targets:
        CollieBar: all
        CollieBarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CollieBarTests
    archive:
      config: Release
