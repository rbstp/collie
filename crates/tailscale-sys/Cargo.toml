[package]
name = "tailscale-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND BSD-3-Clause"
repository.workspace = true
publish = false
links = "tailscale"
build = "build.rs"

[build-dependencies]
# prettyplease is off: bindgen allows syn 2 or 3 and prettyplease 0.2 or 0.3 independently, and
# cargo can resolve them to different syn majors, which fails to compile. The formatter is rustfmt.
bindgen = { version = "0.73.2", default-features = false, features = ["logging", "runtime"] }

[lints]
workspace = true
