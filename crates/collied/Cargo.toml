[package]
name = "collied"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
apns-h2 = "0.11.0"
base64.workspace = true
collie-tls.workspace = true
chacha20poly1305 = { workspace = true, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util.workspace = true
getrandom.workspace = true
protocol.workspace = true
qrcode = { version = "0.14.1", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "process", "system", "termios"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6.1"
tailnet.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = "3.7.0"
security-framework-sys = "2.17.0"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
