[workspace]
resolver = "3"
members = [
    "crates/collie-core",
    "crates/collied",
    "crates/e2e",
    "crates/protocol",
    "crates/tailnet",
    "crates/tailscale-sys",
    "crates/tls",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/rbstp/collie"

[workspace.dependencies]
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false }
collie-tls = { path = "crates/tls" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
libc = "0.2.190"
protocol = { path = "crates/protocol" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tailnet = { path = "crates/tailnet" }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
uniffi = "0.32.2"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
