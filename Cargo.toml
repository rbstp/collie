[workspace]
resolver = "3"
members = [
    "crates/collie-core",
    "crates/collied",
    "crates/e2e",
    "crates/protocol",
    "crates/tailnet",
    "crates/tailscale-sys",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/rbstp/collie"

[workspace.dependencies]
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
