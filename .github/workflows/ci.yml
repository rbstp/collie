name: ci
run-name: "[ci] - testing ${{ github.ref_name }}"

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/deploy-pages.md'
      - 'docs/site/**'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # rust and ios are required checks, so a pull request skips them with if
  # (a skipped job passes) rather than with paths-ignore (which would leave them pending).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ios: ${{ steps.diff.outputs.ios }}

    steps:
      - name: checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: list the changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"
          # Only paths no test reads: tests read docs/protocol/ and docs/tailnet.md.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/site/|docs/deploy-pages\.md$|README\.md$|AGENTS\.md$|CLAUDE\.md$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          # What the app builds from or its tests read (PreviewTests reads collied's fixtures).
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qE '^(Collie/|crates/(collie-core|protocol|tailnet|tls|tailscale-sys|uniffi-bindgen)/|crates/collied/tests/fixtures/|docs/protocol/|scripts/ghostty/|scripts/notices\.py$|scripts/(test-)?ios-test-budget\.py$|\.github/workflows/ci\.yml$|\.gitmodules$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|about\.toml$|justfile$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: xcode-27

    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: cache the Go toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/go/1.27.3/arm64
            ${{ runner.tool_cache }}/go/1.27.3/arm64.complete
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-1.27.3

      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false

      - name: test VM harness isolation
        run: python3 scripts/test-vm-simulator.py

      - name: install the rust toolchain
        run: rustup toolchain install

      - name: cache cargo and go builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            target
          key: rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/tailscale-sys/libtailscale/go.sum', 'crates/tailscale-sys/patches/**/*.patch', 'crates/tailnet/testcontrol/go.sum') }}
          restore-keys: rust-

      - name: test local tailnet control
        run: go -C crates/tailnet/testcontrol test ./...

      - name: install just and cargo-deny
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL -o "$RUNNER_TEMP/just.tar.gz" \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-aarch64-apple-darwin.tar.gz
          echo "50ae3e996c974a0bf32ea7d10f495070df33f1b43e0616b2769e3d4821ed8f48  $RUNNER_TEMP/just.tar.gz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$bin" just
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-aarch64-apple-darwin.tar.gz
          echo "fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3  $RUNNER_TEMP/cargo-deny.tar.gz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$bin" --strip-components 1 cargo-deny-0.20.2-aarch64-apple-darwin/cargo-deny
          echo "$bin" >> "$GITHUB_PATH"

      - name: install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest@0.9.148

      - name: lint
        run: just lint

      - name: test
        run: just test

  ios:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios != 'false') }}
    runs-on: xcode-27

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # Every input of the simulator xcframework and the acknowledgements, libtailscale's pin included: a hit skips Go and Rust.
      - name: key the native build
        id: native
        run: |
          key="$({ xcodebuild -version; git rev-parse HEAD:Cargo.lock HEAD:Cargo.toml HEAD:rust-toolchain.toml HEAD:about.toml \
            HEAD:justfile HEAD:.github/workflows/ci.yml HEAD:scripts/notices.py HEAD:scripts/ghostty HEAD:crates/collie-core \
            HEAD:crates/protocol HEAD:crates/tailnet HEAD:crates/tls HEAD:crates/tailscale-sys HEAD:crates/uniffi-bindgen \
            HEAD:Collie/GhosttyTerminal/Sources/GhosttyTerminal/Fonts HEAD:Collie/Resources/Octicons-LICENSE.txt; } | shasum -a 256)"
          echo "key=ios-native-${key%% *}" >> "$GITHUB_OUTPUT"

      # Before the boot below, which slows every restore for minutes.
      - name: cache the native build
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Collie/CollieCore/CollieCore.xcframework
            Collie/CollieCore/Sources/CollieCore/collie_core.swift
            Collie/Resources/Acknowledgements.json
          key: ${{ steps.native.outputs.key }}

      # Keyed on content, unlike DerivedData's timestamps; master builds without it and saves, so an entry holds one build.
      - name: restore Xcode's compilation cache
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ios/DerivedData/CompilationCache.noindex
          key: ios-cas-${{ github.sha }}
          restore-keys: ios-cas-

      # Overlaps the simulator's first boot on a fresh runner with the builds below. The boot
      # saturates the runner for minutes: set up go has taken 8 to 338 s here against 2 to 5 s in rust,
      # and with the boot started after the rust toolchain, restoring the cargo cache took 369 s.
      - name: boot the simulator
        run: xcrun simctl bootstatus 'iPhone 18 Pro' -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      # setup-go otherwise unpacks Go from scratch on every macOS runner.
      - name: cache the Go toolchain
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/go/1.27.3/arm64
            ${{ runner.tool_cache }}/go/1.27.3/arm64.complete
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-1.27.3

      - name: set up go
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false

      - name: install the rust toolchain
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        run: rustup toolchain install

      - name: cache cargo and go builds
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            target/release
            target/aarch64-apple-ios-sim
          key: ios-sim-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/tailscale-sys/libtailscale/go.sum', 'crates/tailscale-sys/patches/**/*.patch') }}
          restore-keys: ios-sim-

      - name: install just and xcodegen
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL -o "$RUNNER_TEMP/just.tar.gz" \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-aarch64-apple-darwin.tar.gz
          echo "50ae3e996c974a0bf32ea7d10f495070df33f1b43e0616b2769e3d4821ed8f48  $RUNNER_TEMP/just.tar.gz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$bin" just
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          {
            echo "$bin"
            echo "$RUNNER_TEMP/xcodegen/bin"
          } >> "$GITHUB_PATH"

      - name: cache libghostty-vt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Collie/GhosttyTerminal/GhosttyVt.xcframework
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ghostty/build-xcframework.sh') }}

      - name: build libghostty-vt
        run: just ios-ghostty

      - name: build the simulator xcframework
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        run: just ios-framework sim

      # The ios-project recipe's two halves, so a hit runs only XcodeGen.
      - name: write the acknowledgements
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/notices.py ios Collie/Resources/Acknowledgements.json

      - name: generate the project
        run: xcodegen generate --spec Collie/project.yml

      # The iOS app embeds the watch app, so every iOS build also builds for watchOS.
      - name: install the watchOS platform
        run: xcrun simctl list runtimes | grep -q watchOS || xcodebuild -downloadPlatform watchOS

      - name: test the budget script
        run: python3 scripts/test-ios-test-budget.py

      - name: test
        run: |
          echo 'COMPILATION_CACHE_ENABLE_CACHING = YES' > "$RUNNER_TEMP/ci.xcconfig"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/ci.xcconfig" just --no-deps test_iterations=2 ios-test never

      - name: save Xcode's compilation cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ios/DerivedData/CompilationCache.noindex
          key: ios-cas-${{ github.sha }}

      # Fails over a ceiling in Collie/Tests/budget.json, and reports after failed tests too.
      - name: check the test budget
        if: ${{ !cancelled() }}
        run: python3 scripts/ios-test-budget.py measure Collie/Tests/budget.json target/ios/DerivedData/Logs/Test "$RUNNER_TEMP/ios-test-metrics.json"

      # ios-test-budget.yml compares a pull request's metrics with master's.
      - name: keep the test metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-metrics
          path: ${{ runner.temp }}/ios-test-metrics.json
          if-no-files-found: ignore

  desktop-packaging:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: test desktop packaging and service refresh
        run: |
          python3 -m unittest discover -s scripts/desktop -p 'test_*.py'
          bash -n scripts/desktop/*.sh
